name: Docker

on:
  workflow_dispatch:
    inputs:
      images:
        description: 'Input docker image names separated via comma'
        required: true
        default: 'hello-world:latest,ubuntu:latest'
      platforms:
        description: 'Input the platforms separated via comma for the docker images, currently support linux/amd64, linux/386 and linux/arm64'
        required: false
        default: 'linux/amd64'
      registry:
        description: 'Input your registry name'
        required: false
        default: 'registry.app.ynu.edu.cn'
      username:
        description: 'Input your username for your registry if required, override the DOCKER_USERNAME environment variable if provided'
        required: false
        default: ''
      password:
        description: 'Input your password for your registry if required, override the DOCKER_PASSWORD environment variable if provided'
        required: false
        default: ''

jobs:

  pull_and_push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Use easimon/maximize-build-space@master change the free disk spaces from 22G to 512M
    # See https://github.com/liudonghua123/docker_image_pusher/actions/runs/11320152355/job/31477255194
    # - name: Before Cleanup space
    #   run: |
    #     mount
    #     df -h

    # - name: Maximize build space
    #   uses: easimon/maximize-build-space@master
    #   with:
    #     root-reserve-mb: 512
    #     swap-size-mb: 1024
    #     remove-dotnet: 'true'
    #     remove-android: 'true'
    #     remove-haskell: 'true'
    #     remove-codeql: 'true'

    # - name: After Cleanup space
    #   run: |
    #     mount
    #     df -h

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Pull Docker Images from Docker Hub
      run: |
        images="${{ github.event.inputs.images }}"
        platforms="${{ github.event.inputs.platforms }}"
        IFS=',' read -r -a image_array <<< "$images"
        IFS=',' read -r -a platform_array <<< "$platforms"
        for image in "${image_array[@]}"; do
          for platform in "${platform_array[@]}"; do
            echo docker pull "${image}"
            docker pull "${image}" --platform "${platform}"
            echo docker tag "${image}" "${{ github.event.inputs.registry }}/${image}-${platform}"
            # tag the images with suffix -platform for the latter docker manifest create/push to just handle specific platforms
            # This can also simplify by just only execute `docker buildx imagetools create --tag registry.app.ynu.edu.cn/nginx:latest nginx:latest`
            # But this will mirror all the platforms like linux/amd64, linux/arm/v5, linux/arm/v7, linux/arm64/v8, linux/386, linux/mips64le, linux/ppc64le, linux/s390x
            docker tag "${image}" "${{ github.event.inputs.registry }}/${image}-${platform}"
          done
        done
      
    - name: Push Docker Images to Registry ${{ github.event.inputs.registry }}
      run: |
        # set DOCKER_USERNAME and DOCKER_PASSWORD from inputs if provided, fallback to environment variables
        DOCKER_USERNAME="${{ github.event.inputs.username != '' && github.event.inputs.username || secrets.DOCKER_USERNAME }}"
        DOCKER_PASSWORD="${{ github.event.inputs.password != '' && github.event.inputs.password || secrets.DOCKER_PASSWORD }}"
        # if username and password is not empty, docker login the registry
        if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
          echo docker login -u "$DOCKER_USERNAME" "${{ github.event.inputs.registry }}"
          docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD" "${{ github.event.inputs.registry }}"
        fi
        images="${{ github.event.inputs.images }}"
        platforms="${{ github.event.inputs.platforms }}"
        IFS=',' read -r -a image_array <<< "$images"
        IFS=',' read -r -a platform_array <<< "$platforms"
        for image in "${image_array[@]}"; do
          for platform in "${platform_array[@]}"; do
            echo docker push "${{ github.event.inputs.registry }}/${image}-${platform}"
            docker push "${{ github.event.inputs.registry }}/${image}-${platform}"
          done
        done
        # enable buildx to support multi-platform docker images
        docker buildx use default
        for image in "${image_array[@]}"; do
          cmd="docker manifest create ${{ github.event.inputs.registry }}/${image}"
          for platform in "${platforms[@]}"; do
            cmd+=" --amend ${{ github.event.inputs.registry }}/${image}-${platform}"
          done
          echo "docker manifest create: $cmd"
          $cmd
          docker manifest push ${{ github.event.inputs.registry }}/${image}
        done
